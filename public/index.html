<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#12122a">
<title>Join Quiz</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
  body{min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px}
  .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:4px 2px 12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem}
  .screen{flex:1;display:flex;flex-direction:column}
  .join{margin:auto 0;display:flex;flex-direction:column;gap:14px}
  .join h1{font-size:2.6rem;margin:0 0 6px;text-align:center}
  .pin-input{font-size:1.8rem;text-align:center;letter-spacing:.3em;font-weight:800}
  .qtext{font-size:1.3rem;font-weight:800;line-height:1.3;margin:6px 0 10px}
  .qimg{max-width:100%;max-height:28vh;border-radius:12px;align-self:center;margin-bottom:10px}
  .tbar{height:8px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin-bottom:14px}
  .tbar i{display:block;height:100%;background:var(--accent);width:100%}
  .opts{display:grid;gap:10px;flex:1;align-content:start}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{background:var(--c);color:#fff;border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;text-align:left;font-size:1.1rem;min-height:74px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
  .opt.dim{opacity:.25}
  .opt.picked{outline:4px solid #fff}
  .big{font-size:4.5rem;line-height:1}
  .result{flex:1;border-radius:24px;margin:8px 0;padding:24px}
  .result.good{background:linear-gradient(160deg,#1fa65a,#14713f)}
  .result.bad{background:linear-gradient(160deg,#e33c58,#8f1d33)}
  .result.none{background:var(--card)}
  .score{font-size:1rem;font-weight:700;opacity:.9}
  .podium{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:18px 0}
  .podium{width:100%}.podium div{background:var(--card);border-radius:12px 12px 0 0;padding:10px 6px;flex:1;font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
  .err{color:var(--bad);font-weight:600;min-height:1.2em;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Staff<b>Quiz</b> Live</span><span id="meta" class="pill hidden"></span></div>

  <!-- JOIN -->
  <section id="s-join" class="screen">
    <div class="join">
      <h1 class="brand">Staff<b>Quiz</b></h1>
      <div><label for="pin">Game PIN</label><input id="pin" class="pin-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off"></div>
      <div><label for="name">Your name</label><input id="name" maxlength="24" placeholder="e.g. Nimal P" autocomplete="name"></div>
      <div id="sid-wrap"><label for="sid">Staff ID <span class="muted">(if your host asks for it)</span></label><input id="sid" maxlength="24" placeholder="e.g. EMP-042"></div>
      <button id="joinBtn" class="btn-primary btn-big">Join game</button>
      <div id="err" class="err"></div>
    </div>
  </section>

  <!-- GENERIC MESSAGE -->
  <section id="s-msg" class="screen center hidden">
    <div id="msg-icon" class="big pop">🎉</div>
    <h2 id="msg-title" style="margin:14px 0 6px"></h2>
    <p id="msg-sub" class="muted" style="font-size:1.05rem"></p>
  </section>

  <!-- QUESTION -->
  <section id="s-q" class="screen hidden">
    <div class="muted" id="q-num" style="font-weight:700"></div>
    <div class="qtext" id="q-text"></div>
    <img id="q-img" class="qimg hidden" alt="">
    <div class="tbar"><i id="tbar"></i></div>
    <div class="opts" id="opts"></div>
    <p id="locked" class="center muted hidden" style="font-weight:700;margin-top:14px">🔒 Answer locked in — waiting for others…</p>
  </section>

  <!-- RESULT -->
  <section id="s-r" class="screen hidden">
    <div id="r-box" class="result center pop">
      <div id="r-icon" class="big" style="font-size:6rem;font-weight:900"></div>
      <h2 id="r-title" style="font-size:2rem;margin:12px 0 4px"></h2>
      <div id="r-points" style="font-size:1.5rem;font-weight:800"></div>
      <p id="r-correct" style="margin:14px 0 0;font-weight:600"></p>
      <p id="r-rank" class="score" style="margin-top:18px"></p>
    </div>
  </section>

  <!-- FINAL -->
  <section id="s-f" class="screen center hidden">
    <div class="big pop" id="f-icon">🏆</div>
    <h2 id="f-title" style="font-size:2rem;margin:10px 0 0"></h2>
    <p id="f-score" class="muted" style="font-size:1.1rem"></p>
    <div class="podium" id="podium"></div>
  </section>
</div>

<script src="common.js"></script>
<script type="module">
import { createBackend } from './backend.js';
const qs = new URLSearchParams(location.search);
const show = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id)); };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

$('#pin').value = qs.get('pin') || ls.get('sq_session')?.pin || '';
$('#name').value = ls.get('sq_name') || '';
if ($('#pin').value) setTimeout(() => $('#name').focus(), 50);

let be = null, pin = null, game = null, me = null, myPick = {}, unsub = [], lastKey = '', stopBar = null, qLocalEnd = 0;

function msg(icon, title, sub) { $('#msg-icon').textContent = icon; $('#msg-title').textContent = title; $('#msg-sub').textContent = sub || ''; show('s-msg'); }
const err = (t) => { $('#err').textContent = t || ''; };

const ready = createBackend().then(b => (be = b)).catch(e => { console.error(e); err('Could not connect. Check your internet and reload.'); });

async function join(auto) {
  await ready; if (!be) return;
  const s = ls.get('sq_session');
  const p = auto ? s.pin : $('#pin').value.trim();
  if (!/^\d{6}$/.test(p)) return err('Enter the 6-digit PIN.');
  $('#joinBtn').disabled = true;
  try {
    const g = await be.getGame(p);
    if (!g || g.phase === 'ended') throw new Error('Game not found. Check the PIN.');
    const existing = await be.getPlayer(p, be.uid);
    if (existing) {
      if (existing.kicked) throw new Error('You were removed from this game.');
    } else {
      if (auto) throw new Error('');
      const nm = $('#name').value.trim().replace(/\s+/g, ' ').slice(0, 24);
      const sid = $('#sid').value.trim().slice(0, 24);
      if (!nm) throw new Error('Enter your name.');
      if (g.settings?.requireId && !sid) { $('#sid-wrap').classList.remove('hidden'); throw new Error('Enter your staff ID.'); }
      if (g.phase !== 'lobby' && g.settings?.lateJoin === false) throw new Error('The quiz has already started.');
      const display = sid ? `${nm} (${sid})` : nm;
      if (await be.nameTaken(p, display.toLowerCase())) throw new Error('That name is taken — add an initial.');
      await be.addPlayer(p, { name: display, nameLower: display.toLowerCase(), joinedAt: be.SERVER_TS });
      ls.set('sq_name', nm);
    }
    ls.set('sq_session', { pin: p });
    err(''); start(p);
  } catch (e) {
    if (auto) { ls.set('sq_session', null); show('s-join'); }
    else err(e.message || 'Could not join. Try again.');
  } finally { $('#joinBtn').disabled = false; }
}
$('#joinBtn').onclick = () => { beep(0, 1); join(false); };
['pin', 'name', 'sid'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') join(false); }));

function start(p) {
  pin = p; unsub.forEach(f => f()); unsub = [];
  msg('✅', "You're in!", 'Look for your name on the big screen. The quiz will start soon.');
  unsub.push(be.watchPlayer(pin, be.uid, (d) => {
    me = d;
    if (d?.kicked) { stopAll(); ls.set('sq_session', null); msg('🚫', 'Removed by host', 'You can re-join with a different name.'); setTimeout(() => show('s-join'), 3000); }
  }));
  unsub.push(be.watchGame(pin, (g) => { if (g && !me?.kicked) render(g); }));
}
function stopAll() { unsub.forEach(f => f()); unsub = []; }

function myBoard(g) {
  const b = g.board || [];
  const i = b.findIndex(x => x.id === be.uid);
  return i < 0 ? null : { ...b[i], rank: i + 1, of: b.length, ahead: i > 0 ? b[i - 1] : null };
}

function render(g) {
  game = g;
  const mb = myBoard(g);
  $('#meta').classList.remove('hidden');
  $('#meta').textContent = `${me?.name || ''} · ${mb ? mb.score : 0} pts`;
  const key = g.phase + ':' + g.qIndex, fresh = key !== lastKey; lastKey = key;
  if (stopBar && g.phase !== 'question') { stopBar(); stopBar = null; }
  const showRank = g.settings?.showRank !== false;
  switch (g.phase) {
    case 'lobby': msg('✅', "You're in!", 'Look for your name on the big screen. The quiz will start soon.'); break;
    case 'countdown': msg('⏱️', g.qIndex === 0 ? 'Get ready!' : `Question ${g.qIndex + 1} coming up`, 'Answer fast — speed earns more points.'); if (fresh) beep(520); break;
    case 'question': if (g.q) renderQuestion(g, fresh); break;
    case 'reveal': renderResult(g, mb, showRank, fresh); break;
    case 'leaderboard': {
      if (!showRank || !mb) { msg('📊', 'Leaderboard on the big screen', ''); break; }
      const b = mb.ahead ? `${mb.ahead.score - mb.score} pts behind ${mb.ahead.name}` : 'You are leading! 🔥';
      msg(mb.rank === 1 ? '👑' : '📊', `You're #${mb.rank} of ${mb.of}`, b); break;
    }
    case 'final': renderFinal(g, mb, fresh); break;
    case 'ended': stopAll(); ls.set('sq_session', null); msg('👋', 'Game ended', 'Thanks for playing!'); break;
  }
}

function renderQuestion(g, fresh) {
  const q = g.q, qi = g.qIndex;
  show('s-q');
  if (fresh) qLocalEnd = Date.now() + q.time * 1000;
  const picked = myPick[qi] ?? null;
  $('#q-num').textContent = `Question ${qi + 1} of ${g.total}`;
  $('#q-text').textContent = q.text;
  const img = $('#q-img'); if (q.image) { img.src = q.image; img.classList.remove('hidden'); } else img.classList.add('hidden');
  const box = $('#opts');
  box.className = 'opts' + (q.options.length === 4 && q.options.every(o => o.length <= 18) ? ' two' : '');
  box.innerHTML = q.options.map((o, i) => `<button class="opt ${picked != null ? (picked === i ? 'picked' : 'dim') : ''}" data-i="${i}" ${picked != null ? 'disabled' : ''}><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('');
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(qi, +b.dataset.i));
  $('#locked').classList.toggle('hidden', picked == null);
  if (fresh || !stopBar) {
    if (stopBar) stopBar();
    const bar = $('#tbar'); let raf;
    const tick = () => { const left = Math.max(0, qLocalEnd - Date.now()); bar.style.width = (100 * left / (q.time * 1000)) + '%'; bar.style.background = left < q.time * 250 ? 'var(--bad)' : 'var(--accent)'; if (left > 0) raf = requestAnimationFrame(tick); };
    tick(); stopBar = () => cancelAnimationFrame(raf);
  }
}

function answer(qi, i) {
  if (myPick[qi] != null || game?.phase !== 'question' || game.qIndex !== qi) return;
  myPick[qi] = i;
  if (navigator.vibrate) navigator.vibrate(30);
  renderQuestion(game, false);
  be.submitAnswer(pin, qi, i).catch(() => { toast('Too late — time is up!'); });
}

function renderResult(g, mb, showRank, fresh) {
  const r = g.reveal || {}; show('s-r');
  const answered = !!mb?.la, correct = !!mb?.lc;
  const box = $('#r-box');
  box.className = 'result center ' + (!answered ? 'none' : correct ? 'good' : 'bad') + (fresh ? ' pop' : '');
  $('#r-icon').textContent = !answered ? '⌛' : correct ? '✓' : '✕';
  $('#r-title').textContent = !answered ? "Time's up!" : correct ? 'Correct!' : 'Not quite';
  $('#r-points').textContent = correct ? `+${mb.last} pts` + (mb.streak > 1 ? `  🔥 ${mb.streak} in a row` : '') : '+0 pts';
  $('#r-correct').textContent = correct || r.correct == null ? '' : `Correct answer: ${SHAPES[r.correct]} ${g.q.options[r.correct]}`;
  $('#r-rank').textContent = mb ? (showRank ? `You're #${mb.rank} of ${mb.of} · ${mb.score} pts total` : `${mb.score} pts total`) : '';
  if (fresh && correct) beep(880, 160);
}

function renderFinal(g, mb, fresh) {
  show('s-f');
  const medals = ['🥇', '🥈', '🥉'];
  $('#f-icon').textContent = mb && mb.rank <= 3 ? medals[mb.rank - 1] : '🏁';
  $('#f-title').textContent = mb ? `You finished #${mb.rank} of ${mb.of}` : 'Quiz finished!';
  $('#f-score').textContent = `${mb ? mb.score : 0} points`;
  const t = (g.board || []).slice(0, 3), order = [1, 0, 2], hts = [110, 150, 80];
  $('#podium').innerHTML = order.filter(i => t[i]).map(i => `<div style="height:${hts[order.indexOf(i)]}px">${medals[i]}<br>${esc(t[i].name)}<br><span class="muted">${t[i].score}</span></div>`).join('');
  if (fresh && mb && mb.rank <= 3) confetti();
  ls.set('sq_session', null);
}

// auto-rejoin after refresh / phone sleep
const s = ls.get('sq_session');
if (s && (!qs.get('pin') || qs.get('pin') === s.pin)) join(true);
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
